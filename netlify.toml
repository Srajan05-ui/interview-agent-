[build]
  command = "cd frontend && npm install && npm run build && cd .. && mkdir -p netlify/functions/api && cp -r backend/* netlify/functions/api/"
  publish = "frontend/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  PYTHON_VERSION = "3.11"

[functions]
  included_files = ["./**/*.py", "./**/*.json"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
