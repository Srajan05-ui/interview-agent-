[build]
  command = "cd frontend && npm install && npm run build && cd .. && mkdir -p netlify/functions/api && cp -r backend/* netlify/functions/api/ && mv netlify/functions/api/api.py netlify/functions/api/main.py"
  publish = "frontend/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  PYTHON_VERSION = "3.11"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
